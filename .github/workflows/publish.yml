name: Publish crates.io packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUST_VERSION: 1.85.0

jobs:
  publish:
    name: Publish workspace
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        run: >-
          rustup toolchain install "$RUST_VERSION" --profile minimal
          --no-self-update

      - name: Install current stable Rust
        run: >-
          rustup toolchain install stable --profile minimal --no-self-update

      - name: Check release tag version
        run: ./scripts/check-version.sh "$GITHUB_REF_NAME"

      # Configure CARGO_REGISTRY_TOKEN as a repository or environment secret.
      - name: Publish packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +stable publish --workspace --locked
