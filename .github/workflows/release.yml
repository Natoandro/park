name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUST_VERSION: 1.85.0

jobs:
  checks:
    name: Release checks
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: Build binary
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        run: >-
          rustup toolchain install "$RUST_VERSION" --profile minimal
          --no-self-update

      - name: Check release tag version
        run: ./scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Build release binary
        run: cargo "+$RUST_VERSION" build --locked --release --bin park

      - name: Package binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          target="x86_64-unknown-linux-gnu"
          staging="dist/park-${RELEASE_TAG}-${target}"
          mkdir -p "$staging"
          install -Dm755 target/release/park "$staging/park"
          cp LICENSE README.md "$staging/"
          tar -czf "dist/park-${RELEASE_TAG}-${target}.tar.gz" -C dist \
            "park-${RELEASE_TAG}-${target}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: park-binary
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: park-binary
          path: dist

      - name: Create checksums
        run: sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/*
          --title "Park $GITHUB_REF_NAME" --generate-notes

  publish:
    name: Publish crates.io packages
    needs: checks
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        run: >-
          rustup toolchain install "$RUST_VERSION" --profile minimal
          --no-self-update

      - name: Install current stable Rust
        run: >-
          rustup toolchain install stable --profile minimal --no-self-update

      - name: Check release tag version
        run: ./scripts/check-version.sh "$GITHUB_REF_NAME"

      # Configure CARGO_REGISTRY_TOKEN as a repository or environment secret.
      - name: Publish packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +stable publish --workspace --locked

  docs-build:
    name: Build documentation
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.52"

      - name: Build documentation
        run: mdbook build docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  docs-deploy:
    name: Deploy documentation
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
