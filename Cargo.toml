[package]
name = "park-cli"
version = "0.2.1"
edition = "2024"
description = "A project-scoped background process manager for local development"
license = "Apache-2.0"
repository = "https://github.com/Natoandro/park"
exclude = ["src/bin/park-e2e/"]
autobins = false

[workspace]
members = ["e2e", "e2e-macros"]
resolver = "3"

[lib]
name = "park_cli"
path = "src/lib.rs"

[[bin]]
name = "park"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
nix = { version = "0.30", features = ["fs", "process", "signal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
