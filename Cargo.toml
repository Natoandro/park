[package]
name = "park-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A project-scoped background process manager for local development"

[lib]
name = "park_cli"
path = "src/lib.rs"

[[bin]]
name = "park"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
